# cmd
# docker compose -f docker-compose.test.yml down -v

services:
  test-db:
    image: postgres:18
    container_name: test_db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword 
      POSTGRES_DB: medee_test
    volumes:
      - postgres_test_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d medee_test"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_USER=testuser
      - DB_PASSWORD=testpassword
      - DB_NAME=medee_test
      - DB_HOST=test_db
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - HTTPS=false
      - CORS=http://localhost:5173
      - REDIS_PASSWORD=redis123456
      - REDIS_URL=test_redis:6379
      - APP_PORT=3000
      - JWT_SECRET
      - SUPABASE_PROJECT_URL
      - SUPABASE_SERVICE_KEY
      - SUPABASE_BUCKET
      - CI="true"

    ports:
      - "3000:3000"
    depends_on:
      test-db:
        condition:  service_healthy
    
  test_redis:
    image: dhi.io/redis:8.6-debian13
    container_name: test_redis
    environment:
      - REDIS_PASSWORD="redis123456"
    command: [
        "redis-server", 
        "--appendonly", "yes", 
        "--requirepass", "${REDIS_PASSWORD}"
      ]
    ports:
      - "6379:6379"

  

