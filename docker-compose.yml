  jenkins-docker:
    image: docker:dind
    container_name: jenkins-docker
    ports:
      - "2376:2376"
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    privileged: true
    restart: unless-stopped
    networks:
      jenkins:
        aliases:
          - docker
    volumes:
      - jenkins_docker_certs:/certs/client
      - jenkins_data:/var/jenkins_home

  jenkins-blueocean:
    build:
      context: ./Jenkins
      dockerfile: Dockerfile
    image: jenkins-blueocean
    container_name: jenkins-blue-ocean
    restart: on-failure
    networks:
      - jenkins
    environment:
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_CERT_PATH=/certs/client
      - DOCKER_TLS_VERIFY=1
    volumes:
      - jenkins_data:/var/jenkins_home
      - jenkins_docker_certs:/certs/client:ro
    ports:
      - "8000:8080"
      - "50000:50000"


  sonarqube:
    image: dhi.io/sonarqube:25-debian13
    container_name: sonarqube
    networks:
      - jenkins
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ports:
      - "9000:9000"
    volumes:
    # : data files, such as the embedded H2 database and Elasticsearch indexes
      - sonarqube_data:/opt/sonarqube/data
      # : contains SonarQube logs about access, web process, CE process, Elasticsearch logs
      - sonarqube_logs:/opt/sonarqube/logs
      # : for 3rd party plugins
      - sonarqube_extensions:/opt/sonarqube/extensions


  db:
    image: postgres:18
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${DB_PORT}:5432"
    
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10


  go_pgadmin:
    image: elestio/pgadmin:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL} 
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: 
      [
        "redis-server", 
        "--appendonly", "yes", 
        "--requirepass", "${REDIS_PASSWORD}"
      ]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

